<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">How Browser Proxy Twin makes local businesses bookable by agents</title>
  <desc id="description">A shopkeeper publishes a confirmed business card to a directory. A user's agent discovers a hosted shop agent, checks availability and requests a hold. The owner confirms and the user approves before the booking is finalized.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef6f2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6 1 11" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172b3a}
      .title{font-size:30px;font-weight:700}
      .subtitle{font-size:16px;fill:#526575}
      .card{fill:#fff;stroke:#dbe5ea;stroke-width:1.5}
      .heading{font-size:20px;font-weight:700}
      .copy{font-size:15px;fill:#526575}
      .small{font-size:13px;fill:#526575}
      .line{fill:none;stroke:#405667;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .accent{fill:none;stroke:#197a63;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1440" height="760" rx="24" fill="url(#background)"/>
  <text x="720" y="58" text-anchor="middle" class="title">From local business to agent-ready booking</text>
  <text x="720" y="88" text-anchor="middle" class="subtitle">No business website or browser automation required</text>

  <g>
    <rect x="42" y="130" width="300" height="470" rx="20" class="card"/>
    <circle cx="75" cy="169" r="18" fill="#eaf7ee"/>
    <text x="75" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#197a63">1</text>
    <text x="104" y="176" class="heading">Shopkeeper</text>
    <g transform="translate(102 216)">
      <path d="M10 62h152v105H10z" fill="#f3f8f5" stroke="#91b8a5" stroke-width="3"/>
      <path d="M0 62l18-38h136l18 38" fill="#d9efe3" stroke="#197a63" stroke-width="3" stroke-linejoin="round"/>
      <path d="M0 62c0 13 22 13 22 0 0 13 22 13 22 0 0 13 22 13 22 0 0 13 22 13 22 0 0 13 22 13 22 0 0 13 22 13 22 0 0 13 22 13 22 0" fill="none" stroke="#197a63" stroke-width="3"/>
      <rect x="27" y="91" width="46" height="38" rx="4" fill="#fff" stroke="#91b8a5" stroke-width="2"/>
      <path d="M34 101h31M34 110h24M34 119h27" stroke="#91b8a5" stroke-width="2" stroke-linecap="round"/>
      <rect x="103" y="91" width="38" height="76" rx="4" fill="#d9efe3" stroke="#91b8a5" stroke-width="2"/>
      <circle cx="133" cy="131" r="2" fill="#197a63"/>
    </g>
    <text x="192" y="414" text-anchor="middle" class="copy">Describes services, prices</text>
    <text x="192" y="437" text-anchor="middle" class="copy">and opening hours</text>
    <rect x="82" y="475" width="220" height="74" rx="12" fill="#f4f8ff" stroke="#d4e1f3"/>
    <path d="M104 495h23v31h-23zM109 490h23v31" fill="#fff" stroke="#4d78a8" stroke-width="2" stroke-linejoin="round"/>
    <path d="M113 500h13M113 506h13M113 512h9" stroke="#4d78a8" stroke-width="1.7" stroke-linecap="round"/>
    <text x="147" y="504" font-size="14" font-weight="700">Validated agent card</text>
    <text x="147" y="526" class="small">Owner confirms before publish</text>
  </g>

  <path d="M352 350h35" class="arrow"/>
  <text x="370" y="330" text-anchor="middle" class="small">publish</text>

  <g>
    <rect x="394" y="130" width="280" height="470" rx="20" class="card"/>
    <circle cx="427" cy="169" r="18" fill="#eaf1ff"/>
    <text x="427" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#3564a4">2</text>
    <text x="456" y="176" class="heading">Business directory</text>
    <g transform="translate(482 240)">
      <ellipse cx="60" cy="24" rx="58" ry="20" fill="#e8f0ff" stroke="#5279b2" stroke-width="3"/>
      <path d="M2 24v120c0 11 26 20 58 20s58-9 58-20V24" fill="#f4f7ff" stroke="#5279b2" stroke-width="3"/>
      <path d="M2 64c0 11 26 20 58 20s58-9 58-20M2 104c0 11 26 20 58 20s58-9 58-20" fill="none" stroke="#5279b2" stroke-width="3"/>
      <circle cx="60" cy="24" r="5" fill="#5279b2"/>
    </g>
    <text x="534" y="446" text-anchor="middle" class="copy">Search by category, area</text>
    <text x="534" y="469" text-anchor="middle" class="copy">and language</text>
    <rect x="425" y="503" width="218" height="50" rx="12" fill="#f4f8ff" stroke="#d4e1f3"/>
    <circle cx="450" cy="528" r="8" fill="#74a0d4"/>
    <text x="469" y="533" font-size="14" font-weight="600">Discoverable business cards</text>
  </g>

  <path d="M684 350h35" class="arrow"/>
  <text x="702" y="330" text-anchor="middle" class="small">discover</text>

  <g>
    <rect x="726" y="130" width="310" height="470" rx="20" class="card"/>
    <circle cx="759" cy="169" r="18" fill="#fff3df"/>
    <text x="759" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#aa6812">3</text>
    <text x="788" y="176" class="heading">User + user agent</text>
    <g transform="translate(829 222)">
      <circle cx="55" cy="34" r="27" fill="#f9d6b7"/>
      <path d="M17 130c2-37 18-56 38-56s36 19 38 56" fill="#dceaff" stroke="#5279b2" stroke-width="3"/>
      <path d="M33 31c2-24 40-34 51-4-10-5-21-9-33-8-4 8-10 12-18 12z" fill="#33475b"/>
      <path d="M43 40h1M66 40h1M49 53q7 6 14 0" stroke="#6b4936" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="107" y="3" width="86" height="111" rx="14" fill="#f4f8ff" stroke="#5279b2" stroke-width="3"/>
      <rect x="118" y="17" width="64" height="72" rx="5" fill="#fff" stroke="#b8cbe4" stroke-width="2"/>
      <circle cx="150" cy="101" r="4" fill="#5279b2"/>
      <path d="M125 34h50M125 46h50M125 58h38" stroke="#5279b2" stroke-width="3" stroke-linecap="round"/>
      <path d="M146 68l8 8 15-17" fill="none" stroke="#197a63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="760" y="397" width="242" height="65" rx="14" fill="#fff8e9" stroke="#f0d7a7"/>
    <path d="M782 415h17v18h-17zM786 411h17v18" fill="#fff" stroke="#cc8a2c" stroke-width="2" stroke-linejoin="round"/>
    <text x="814" y="423" font-size="14" font-weight="600">“Book a haircut</text>
    <text x="814" y="444" font-size="14" font-weight="600">tomorrow evening”</text>
    <text x="881" y="502" text-anchor="middle" class="copy">Finds and compares options</text>
    <text x="881" y="525" text-anchor="middle" class="copy">User approves before booking</text>
  </g>

  <path d="M1046 350h35" class="arrow"/>
  <text x="1063" y="330" text-anchor="middle" class="small">request</text>

  <g>
    <rect x="1088" y="130" width="310" height="470" rx="20" class="card"/>
    <circle cx="1121" cy="169" r="18" fill="#eaf7ee"/>
    <text x="1121" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#197a63">4</text>
    <text x="1150" y="176" class="heading">Shop agent + owner</text>
    <g transform="translate(1165 218)">
      <rect x="0" y="35" width="145" height="114" rx="9" fill="#f3f8f5" stroke="#91b8a5" stroke-width="3"/>
      <path d="M-10 36l18-31h125l18 31" fill="#d9efe3" stroke="#197a63" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-10 36c0 12 20 12 20 0 0 12 20 12 20 0 0 12 20 12 20 0 0 12 20 12 20 0 0 12 20 12 20 0 0 12 20 12 20 0 0 12 20 12 20 0" fill="none" stroke="#197a63" stroke-width="3"/>
      <rect x="20" y="69" width="47" height="43" rx="4" fill="#fff" stroke="#91b8a5" stroke-width="2"/>
      <path d="M28 80h30M28 89h30M28 98h20" stroke="#91b8a5" stroke-width="2" stroke-linecap="round"/>
      <path d="M96 80h32M96 91h32M96 102h20" stroke="#197a63" stroke-width="3" stroke-linecap="round"/>
      <circle cx="178" cy="52" r="21" fill="#f9d6b7"/>
      <path d="M149 127c2-35 14-52 29-52s27 17 29 52" fill="#e8efff" stroke="#5279b2" stroke-width="3"/>
      <path d="M159 48c4-19 34-27 42-2-9-5-18-7-29-6-3 5-7 8-13 8z" fill="#33475b"/>
      <path d="M169 55h1M184 55h1M171 65q7 5 13 0" stroke="#6b4936" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="1243" y="395" text-anchor="middle" class="copy">Checks free slots and locks one</text>
    <rect x="1121" y="421" width="244" height="51" rx="12" fill="#fff8e9" stroke="#f0d7a7"/>
    <circle cx="1148" cy="446" r="13" fill="#fff" stroke="#cc8a2c" stroke-width="2"/>
    <path d="M1148 438v9l6 4" fill="none" stroke="#cc8a2c" stroke-width="2" stroke-linecap="round"/>
    <text x="1171" y="451" font-size="14" font-weight="600">Owner confirms or declines</text>
    <rect x="1121" y="492" width="244" height="52" rx="12" fill="#eaf7ee" stroke="#b7ddc5"/>
    <circle cx="1148" cy="518" r="14" fill="#197a63"/>
    <path d="M1141 518l5 5 9-11" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1171" y="523" font-size="14" font-weight="700" fill="#17664f">Booking finalized</text>
  </g>

  <rect x="177" y="635" width="1086" height="75" rx="18" fill="#173f50"/>
  <circle cx="218" cy="672" r="19" fill="#d9efe3"/>
  <path d="M209 672l6 6 12-14" fill="none" stroke="#197a63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="253" y="668" font-size="17" font-weight="700" fill="#fff">Two human checks keep the booking safe</text>
  <text x="253" y="691" font-size="14" fill="#d7e7ec">Owner confirms the request  →  User approves  →  Slot is booked without double-booking</text>
  <text x="1227" y="680" text-anchor="end" font-size="13" fill="#c6d9df">query · hold · status · book · cancel</text>
</svg>
