<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>KadaiCard demo</title>
<style>
  /* STEP 1: look and chat-style log */
  body { font-family: Arial, sans-serif; background: #f1f5f2; color: #0f3d3e; max-width: 800px; margin: 20px auto; padding: 0 16px; }
  textarea, input { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; border: 1px solid #c5d0ca; border-radius: 8px; }
  button { background: #f2a900; border: 0; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 8px 8px 0 0; }
  button.yes { background: #1b7f3b; color: #fff; }
  button.no { background: #fff; color: #b3261e; border: 1px solid #b3261e; }
  pre { background: #fff; padding: 10px; border-radius: 8px; overflow-x: auto; }
  #log { display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 75%; padding: 10px 14px; border-radius: 14px; }
  .user   { background: #dbe4ff; align-self: flex-start; }
  .shop   { background: #d8f2ee; align-self: flex-end; }
  .system { background: #eceeed; align-self: center; font-size: 13px; }
  .done   { background: #1b7f3b; color: #fff; align-self: center; font-weight: bold; }
  /* STEP 3: counters */
  .counters { display: flex; gap: 12px; margin: 12px 0; }
  .counter { background: #0f3d3e; color: #fff; padding: 8px 16px; border-radius: 10px; }
  .counter b { font-size: 24px; display: block; }
  /* STEP 4: fake WhatsApp bubble and approval box */
  .wa { background: #dcf8c6; border-radius: 14px; padding: 14px; max-width: 380px; margin-top: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  .summary { border: 2px solid #f2a900; background: #fff; border-radius: 12px; padding: 14px; margin-top: 12px; max-width: 420px; }
</style>
</head>
<body>
<h1>KadaiCard demo</h1>

<!-- STEP 3: counters -->
<div class="counters">
  <div class="counter"><b id="msgCount">0</b>messages exchanged</div>
  <div class="counter"><b>0</b>pages loaded</div>
</div>

<h2>1. Shop: describe your business</h2>
<textarea id="desc" rows="3" cols="60">Tailor shop called Meena Boutique. Blouse stitching ₹280. Open 10 am to 6 pm.</textarea><br>
<button onclick="makeCard()">Generate card</button>
<!-- STEP 5: Tamil sample button -->
<button onclick="tamilSample()">Tamil sample</button>
<pre id="card"></pre>

<h2>2. User: ask your agent</h2>
<input id="ask" size="40" value="Book a tailor tomorrow morning">
<button onclick="runAgent()">Send</button>
<!-- STEP 4: the WhatsApp bubble and approval box appear here -->
<div id="stage"></div>

<h2>Agent log</h2>
<div id="log"></div>

<script>
// STEP 2: more shops. slots are 24-hour times (16 = 4 pm).
let registry = [
  {name:"Sri Muthu Dental Clinic", category:"dentist", price:300, slots:[16,17,18,19]},
  {name:"Thirumalai Dental Hospital", category:"dentist", price:450, slots:[10,11,17,20]},
  {name:"Annapoorani Ladies Tailors", category:"tailor", price:250, slots:[10,11,12,15,16]},
  {name:"Coimbatore North Taluk Office", category:"office", price:0, slots:[10,11,12,14,15]}
];

// STEP 1 + 3: chat bubbles, and the message counter goes up on every message
let messages = 0;
function show(text, kind){
  kind = kind || "user";
  document.getElementById("log").innerHTML += '<div class="bubble ' + kind + '">' + text + '</div>';
  messages++;
  document.getElementById("msgCount").textContent = messages;
}

// STEP 4: show some HTML with buttons and wait until one is clicked
function askButtons(html){
  return new Promise(resolve => {
    const stage = document.getElementById("stage");
    stage.innerHTML = html;
    stage.querySelectorAll("button").forEach(b => {
      b.onclick = () => { stage.innerHTML = ""; resolve(b.dataset.answer); };
    });
  });
}

// STEP 5: Tamil sample text
function tamilSample(){
  document.getElementById("desc").value =
    "நான் தையல் கடை நடத்துகிறேன், called Kavitha Tailoring. Blouse stitching ₹280. Open 10 am to 6 pm.";
}

// PART A: turn the shopkeeper's text into a card
function makeCard(){
  const t = document.getElementById("desc").value;
  // STEP 5: Tamil keywords added to the category check
  const category = /dent|பல்/i.test(t) ? "dentist" : /tailor|blouse|தையல்/i.test(t) ? "tailor" : /office|taluk|அலுவலகம்/i.test(t) ? "office" : "shop";
  const name = (t.match(/called ([^.,]+)/i) || [,"New shop"])[1];
  const price = +(t.match(/₹(\d+)/) || [,0])[1];
  const h = t.match(/(\d+) am to (\d+) pm/i);
  const slots = [];
  if (h) { for (let x = +h[1]; x < +h[2] + 12; x++) slots.push(x); }
  const card = {name, category, price, slots};
  registry.push(card);                       // publish to the registry
  document.getElementById("card").textContent = JSON.stringify(card, null, 2);
}

// PART B: the user's agent finds a shop and books it
async function runAgent(){                   // STEP 4: "async" lets us use "await" below
  document.getElementById("log").innerHTML = "";
  document.getElementById("stage").innerHTML = "";
  messages = 0;
  const q = document.getElementById("ask").value;
  // STEP 5: Tamil keywords added here too
  const cat = /dent|பல்/i.test(q) ? "dentist" : /tailor|blouse|தையல்/i.test(q) ? "tailor" : /office|taluk|certificate|அலுவலகம்/i.test(q) ? "office" : null;
  const morning = /morning/i.test(q);
  show("User agent: looking for a " + cat);

  const found = registry.filter(c => c.category === cat);
  show("Registry: found " + found.length + " shop(s)", "system");
  if (!found.length) return;

  found.sort((a,b) => a.price - b.price);    // cheapest first
  const shop = found[0];
  const slot = (morning ? shop.slots.find(s => s < 12) : shop.slots.find(s => s >= 16)) ?? shop.slots[0];
  show("Shop agent (" + shop.name + "): ₹" + shop.price + ", free slot " + slot + ":00", "shop");

  // STEP 4: WhatsApp bubble for the owner (replaces the first confirm pop-up)
  const ownerAnswer = await askButtons(
    `<div class="wa"><b>WhatsApp: ${shop.name}</b><br>New request: tomorrow ${slot}:00. Confirm?<br>
     <button class="yes" data-answer="yes">Confirm</button>
     <button class="no" data-answer="no">Decline</button></div>`);
  if (ownerAnswer === "no") { show("Owner declined", "system"); return; }
  show("Owner confirmed", "system");

  // STEP 4: approval box for the user (replaces the second confirm pop-up)
  const userAnswer = await askButtons(
    `<div class="summary"><b>Approve this booking?</b><br>${shop.name}<br>Tomorrow, ${slot}:00<br>₹${shop.price}<br>
     <button class="yes" data-answer="yes">Approve</button>
     <button class="no" data-answer="no">Cancel</button></div>`);
  if (userAnswer === "no") { show("Cancelled. Nothing booked.", "system"); return; }
  show("Booking confirmed. Pages loaded: 0", "done");
}
</script>
</body>
</html>
